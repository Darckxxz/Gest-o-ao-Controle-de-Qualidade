name: CI - TaskFlow Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  # Job 1: Verificação de qualidade do código com Flake8
  qualidade:
    name: Qualidade de Código (Flake8)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verificar estilo de código com Flake8
        run: |
          flake8 src/ tests/ --max-line-length=100

  # Job 2: Execução dos testes automatizados (depende de qualidade passar)
  testes:
    name: Testes Automatizados (Pytest)
    runs-on: ubuntu-latest
    needs: qualidade

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Executar testes com relatório detalhado
        run: |
          pytest tests/ -v --tb=short

      - name: Gerar relatório de cobertura de código
        run: |
          pytest tests/ --cov=src --cov-report=term-missing
